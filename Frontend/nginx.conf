server {
    listen       80;
    listen  [::]:80;


    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }


    location /socket.io/ {
      # Resolve the backend hostname per-request via Docker's embedded DNS so a
      # backend container restart (new IP) doesn't leave nginx pinned to a dead
      # address — the default behaviour resolves once at startup and caches forever.
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $socket_backend backend;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $host;
      proxy_pass http://$socket_backend:8000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
}

